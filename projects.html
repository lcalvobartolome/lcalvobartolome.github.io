<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Project ideas – Lorena Calvo-Bartolomé</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Project ideas and previous supervision topics for Lorena Calvo-Bartolomé." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%224%22 fill=%22%231d4ed8%22/><text x=%2216%22 y=%2222%22 font-family=%22Georgia,serif%22 font-size=%2213%22 fill=%22white%22 text-anchor=%22middle%22 font-style=%22italic%22>LCB</text></svg>" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="page">

      <!-- ── NAV ── -->
      <header>
        <div class="logo-wordmark">
          <div class="logo-bar" aria-hidden="true"></div>
          <div>
            <span class="logo-text-main">Lorena Calvo-Bartolomé</span>
          </div>
        </div>
        <nav aria-label="Site navigation">
          <ul>
            <li><a href="index.html">← Main page</a></li>
          </ul>
        </nav>
      </header>

      <main>

        <!-- ── OPEN PROJECTS ── -->
        <section class="section" id="open-projects" data-screen-label="Current ideas">
          <div class="section-heading">
            <div class="section-label">
              <span class="section-label-dot"></span>Open
            </div>
            <h2>Current project ideas</h2>
          </div>
          <div id="openProjectsContainer">
            <div class="ideas-grid" id="openProjectsGrid"></div>
          </div>
        </section>

        <!-- ── PAST PROJECTS ── -->
        <section class="section" id="past-projects" data-screen-label="Past projects">
          <div class="section-heading">
            <div class="section-label">
              <span class="section-label-dot"></span>Past
            </div>
            <h2>Previous thesis topics</h2>
          </div>
          <p class="section-subtitle">
            Topics I've supervised in the past, listed without author names.
          </p>
          <ul class="past-projects-list" id="pastProjectsList"></ul>
        </section>

      </main>

      <footer>
        <span>Lorena Calvo-Bartolomé · <a href="index.html">Back to main page</a></span>
        <span><a href="#top">Back to top ↑</a></span>
      </footer>
    </div>

    <script>
      async function loadProjects() {
        const openGrid = document.getElementById("openProjectsGrid");
        const openContainer = document.getElementById("openProjectsContainer");
        const pastList = document.getElementById("pastProjectsList");
        if (!openGrid || !openContainer || !pastList) return;

        try {
          const res = await fetch("projects.json");
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();

          const openProjects = data.open_projects || [];
          const pastProjects = data.past_projects || [];

          // ── OPEN PROJECTS ──
          if (openProjects.length === 0) {
            openContainer.innerHTML =
              '<p class="section-subtitle">None currently — but write me if you\'d like to work on anything related to my current or past research, or if you think I could be a good supervisor fit.</p>';
          } else {
            openProjects.forEach((proj) => {
              const card = document.createElement("article");
              card.className = "idea-card";

              if (proj.icon) {
                const icon = document.createElement("div");
                icon.className = "idea-icon";
                icon.textContent = proj.icon;
                card.appendChild(icon);
              }

              const h3 = document.createElement("h3");
              h3.textContent = proj.title;
              card.appendChild(h3);

              if (proj.summary) {
                const p = document.createElement("p");
                p.textContent = proj.summary;
                card.appendChild(p);
              }

              if (proj.tags && proj.tags.length) {
                const tagRow = document.createElement("div");
                tagRow.className = "idea-tags";
                proj.tags.forEach((t) => {
                  const span = document.createElement("span");
                  span.textContent = t;
                  tagRow.appendChild(span);
                });
                card.appendChild(tagRow);
              }

              openGrid.appendChild(card);
            });
          }

          // ── PAST PROJECTS ──
          pastProjects.forEach((proj) => {
            const li = document.createElement("li");
            const degree = proj.degree || "";
            const cls = degree.toLowerCase().includes("bsc")
              ? "degree-tag degree-bsc"
              : degree.toLowerCase().includes("msc")
              ? "degree-tag degree-msc"
              : "degree-tag";
            li.innerHTML = proj.title + ' <span class="' + cls + '">' + degree + "</span>";
            pastList.appendChild(li);
          });
        } catch (err) {
          console.error("loadProjects:", err);
          document.getElementById("openProjectsContainer").innerHTML =
            "<p>Could not load project ideas at the moment.</p>";
        }
      }

      document.addEventListener("DOMContentLoaded", loadProjects);
    </script>
  </body>
</html>
